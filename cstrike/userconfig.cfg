alias vol_1 "volume 0.10"
alias vol_2 "volume 0.20"
alias vol_3 "volume 0.50"
// earphone
// alias vol_1 "volume 0.004"
// alias vol_2 "volume 0.004"
// alias vol_3 "volume 0.004"
vol_2

// View Settings
// ex_interp 0.01 // required on some servers
// cl_bob 0.01
cl_bobcycle 0.8
cl_bobup 0.5
cl_lc 1
cl_lw 1
cl_radartype 1

// Use External Crosshair
cl_crosshair_color 0
cl_crosshair_translucent 1
cl_crosshair_size small
cl_dynamiccrosshair 0

hud_fastswitch 1
cl_righthand 0
_cl_autowepswitch 0

// Graphic Settings
brightness 100
gamma 100
gl_vsync 0
fps_max 100
fps_override 1
gl_ansio 16

// Mouse Settings
alias "z_sens_082" "zoom_sensitivity_ratio 0.818933027098955175"
alias "z_sens_100" "zoom_sensitivity_ratio 1.00"
z_sens_082
m_rawinput 1

// Bind Settings
alias "+attack_quiet"                   "+attack; vol_1"
alias "-attack_quiet"                   "-attack; vol_2"
alias "+attack_quiet_walk"              "+speed; +attack_quiet"
alias "-attack_quiet_walk"              "-speed; -attack_quiet"
alias "slot_1_attack_quiet"             "slot1; bind MOUSE1 +attack_quiet"
alias "slot_1_attack_quiet_walk"        "slot1; bind MOUSE1 +attack_quiet_walk"
alias "bind_1_slot_1_attack_quiet"      "bind 1 slot_1_attack_quiet"
alias "bind_1_slot_1_attack_quiet_walk" "bind 1 slot_1_attack_quiet_walk"
bind "0" "slot10; bind MOUSE1 +attack_quiet"
bind_1_slot_1_attack_quiet
bind "2" "slot2; bind MOUSE1 +attack_quiet"
bind "3" "slot3; bind MOUSE1 +attack_quiet"
bind "4" "slot4; bind MOUSE1 +attack_quiet"
bind "5" "slot5; bind MOUSE1 +attack_quiet"
bind "6" "slot6; bind MOUSE1 +attack_quiet"
bind "7" "slot7; bind MOUSE1 +attack_quiet"
bind "8" "slot8; bind MOUSE1 +attack_quiet"
bind "9" "slot9; bind MOUSE1 +attack_quiet"
bind "q" "lastinv; bind MOUSE1 +attack_quiet"

alias "+loud_walk"                  "+speed; vol_3"
alias "-loud_walk"                  "-speed; vol_2"
bind "HOME" "exec userconfig.cfg"
bind "SHIFT" "+duck"
bind "CTRL" "+duck"
bind "CAPSLOCK" "+loud_walk"
bind "MWHEELUP" "+duck"
bind "MWHEELDOWN" "+duck"
bind "MOUSE3" "bind_1_slot_1_attack_quiet"

// Bot Settings
alias yb_add_one_elite_t  "yb add 4 2 1 5"
alias yb_add_one_elite_ct "yb add 4 2 2 5"
alias yb_elite_t  "yb removebots instant; wait; yb_add_one_elite_t;  yb_add_one_elite_t ; yb_add_one_elite_t ; yb_add_one_elite_t ; wait; yb fill 2 15 0 1"
alias yb_elite_ct "yb removebots instant; wait; yb_add_one_elite_ct; yb_add_one_elite_ct; yb_add_one_elite_ct; yb_add_one_elite_ct; wait; yb fill 1 15 0 1"
bind "F9" "alias must_have must_have_t;  echo yb_elite_t; yb_elite_t; echo yb_elite_t"
bind "F10" "alias must_have must_have_ct; echo yb_elite_ct; yb_elite_ct; echo yb_elite_ct"
mp_timelimit 999
mp_limitteams 999
mp_autoteambalance 0

// Buy Settings
alias must_have_t  "vesthelm; vest; flash; hegren; smoke; flash"
alias must_have_ct "vest; hegren; flash; smoke; defuser; flash"
must_have must_have_ct
bind "F1" "awp;             deagle;     must_have;  primammo; secammo;  bind_1_slot_1_attack_quiet"
bind "F2" "sg552; aug;                  must_have;  primammo;           bind_1_slot_1_attack_quiet_walk"
bind "F3" "ak47; m4a1;                  must_have;  primammo;           bind_1_slot_1_attack_quiet_walk"
bind "F4" "famas; galil;                must_have;  primammo;           bind_1_slot_1_attack_quiet_walk"
bind "F5" "mp5;                         flash;      primammo;           bind_1_slot_1_attack_quiet"
bind "F6" "                 deagle;     hegren;     secammo;            bind_1_slot_1_attack_quiet_walk"
bind "F7" "                             must_have;  primammo; secammo;  bind_1_slot_1_attack_quiet_walk"
bind "F8" "m249;                        must_have;  primammo;           bind_1_slot_1_attack_quiet_walk"

echo "userconfig.cfg loaded - 2kliksAlex@YouTube"
echo "F9 - T"
echo "F10 - CT"